<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./assets/icons/curriculum-vitae.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&family=Poppins:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/style.css" />
    <title>Portfolio</title>
  </head>
  <body>
    <div class="overlay"></div>
    <main>
      <section class="hero">
        <button class="burger">
          <img src="./assets/icons/hamburger.svg" alt="burger" />
        </button>

        <div class="side-menu">
          <button class="side-menu__close-btn">
            <img src="./assets/icons/close.svg" alt="close" />
          </button>

          <nav class="menu">
            <ul class="menu__list">
              <li class="menu__item">
                <a href="#"
                  ><div class="menu__circle"></div>
                  <span class="menu__item-text">Про меня</span></a
                >
              </li>
              <li class="menu__item">
                <a href="#"
                  ><div class="menu__circle"></div>
                  <span class="menu__item-text">Мой опыт</span></a
                >
              </li>
              <li class="menu__item">
                <a href="#"
                  ><div class="menu__circle"></div>
                  <span class="menu__item-text">Мои навыки</span></a
                >
              </li>
              <li class="menu__item">
                <a href="#"
                  ><div class="menu__circle"></div>
                  <span class="menu__item-text">Мои работы</span></a
                >
              </li>
              <li class="menu__item">
                <a href="#"
                  ><div class="menu__circle"></div>
                  <span class="menu__item-text">Прайс-лист</span></a
                >
              </li>
              <li class="menu__item">
                <a href="#"
                  ><div class="menu__circle"></div>
                  <span class="menu__item-text">Контакты</span></a
                >
              </li>
            </ul>
          </nav>
          <nav class="side-menu__socials social-icons">
            <ul>
              <li>
                <a href="https://github.com" target="_blank">
                  <img
                    src="./assets/icons/Github.svg"
                    alt="Github"
                    width="20"
                    height="20"
                  />
                </a>
              </li>
              <li>
                <a href="https://www.instagram.com" target="_blank">
                  <img
                    src="./assets/icons/Instagram.svg"
                    alt="Instagram"
                    width="20"
                    height="20"
                  />
                </a>
              </li>
              <li>
                <a href="https://www.facebook.com" target="_blank">
                  <img
                    src="./assets/icons/Facebook.svg"
                    alt="Facebook"
                    width="20"
                    height="20"
                  />
                </a>
              </li>
            </ul>
          </nav>
        </div>

        <div class="socials">
          <p class="socials__text">Социальные сети</p>
          <div class="socials__line"></div>
          <nav class="socials__icons social-icons">
            <ul>
              <li>
                <a href="https://github.com" target="_blank">
                  <img
                    src="./assets/icons/Github.svg"
                    alt="Github"
                    width="20"
                    height="20"
                  />
                </a>
              </li>
              <li>
                <a href="https://www.instagram.com" target="_blank">
                  <img
                    src="./assets/icons/Instagram.svg"
                    alt="Instagram"
                    width="20"
                    height="20"
                  />
                </a>
              </li>
              <li>
                <a href="https://www.facebook.com" target="_blank">
                  <img
                    src="./assets/icons/Facebook.svg"
                    alt="Facebook"
                    width="20"
                    height="20"
                  />
                </a>
              </li>
            </ul>
          </nav>
        </div>
        <div class="hero-content">
          <h1 class="hero-content__title">Меня зовут Александра Смит</h1>
          <p class="hero-content__descr">Я web-разработчик из города Москва</p>
          <div class="hero-content__btns">
            <a class="portf-btn" href="#">Портфолио</a>
            <a class="about-btn" href="#">Про меня</a>
          </div>
        </div>
      </section>
    </main>
    <script src="index.js"></script>
  </body>
</html>
